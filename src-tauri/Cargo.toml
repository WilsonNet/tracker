[package]
name = "tracker"
version = "0.1.0"
description = "A minimal multitrack audio recorder"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
cpal = { version = "0.18", features = ["realtime"] }
ringbuf = "0.4"
crossbeam-channel = "0.5"
hound = "3.5"
jack = "0.13"
tauri-plugin-playwright = { version = "0.4", optional = true }

[features]
default = []
e2e-testing = ["tauri-plugin-playwright"]

# The DSP renders a whole mix offline; keep dev builds usable without -O2's
# full compile cost.
[profile.dev]
opt-level = 1
